# DTGF Social — iOS build & upload to App Store Connect
#
# STAGED, not yet live: this repo has not been created/pushed anywhere.
# Before the first run, a human must create the six repository secrets
# listed in SETUP.md (next to this file).
#
# Pipeline: Capacitor sync -> manual signing with the imported Apple
# Distribution certificate + "DTGF Social App Store" provisioning profile
# -> xcodebuild archive -> App Store .ipa export -> altool upload with
# the App Store Connect API key.
#
# Assumptions (see SETUP.md):
#   - The GitHub repository root is this ios-app/ folder.
#   - Team ID 3SKSMUN285, bundle com.dtgfsocial.app, profile name
#     "DTGF Social App Store" (UUID d2434c4f-3c9a-4559-a314-156796135c1b).
#   - Marketing version stays whatever the project says (1.0); the build
#     number is the workflow run number so every upload is unique.

name: iOS build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    env:
      ASC_DIST_CERT_P12_BASE64: ${{ secrets.ASC_DIST_CERT_P12_BASE64 }}
      ASC_DIST_CERT_PASSWORD: ${{ secrets.ASC_DIST_CERT_PASSWORD }}
      ASC_PROVISIONING_PROFILE_BASE64: ${{ secrets.ASC_PROVISIONING_PROFILE_BASE64 }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      TEAM_ID: "3SKSMUN285"
      BUNDLE_ID: "com.dtgfsocial.app"
      PROFILE_NAME: "DTGF Social App Store"
      PROFILE_UUID: "d2434c4f-3c9a-4559-a314-156796135c1b"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capacitor sync (copies web shell, installs pods)
        run: npx cap sync ios

      - name: Install the Apple Distribution certificate
        run: |
          echo "$ASC_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/dist.p12" -P "$ASC_DIST_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm "$RUNNER_TEMP/dist.p12"

      - name: Install the provisioning profile
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$ASC_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      - name: Install the App Store Connect API key
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_API_KEY_ID.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_API_KEY_ID.p8"

      - name: Write ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Archive
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/DTGF.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export the App Store .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DTGF.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to App Store Connect
        run: |
          IPA_PATH="$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" \
            --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"

      - name: Keep the .ipa and symbols as run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtgf-social-ios-build-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/DTGF.xcarchive/dSYMs
          if-no-files-found: ignore
